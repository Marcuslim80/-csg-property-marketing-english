number":28,"text":"Our service does not end once the sale is completed.\n\nFrom consultation and viewing to financing and after-sales support, we aim to make the journey smoother.\n\nWe listen first, analyse carefully and recommend only when it makes sense.\n\n#CSGPROPERTY #TrustedPropertyAdvisor #ProfessionalService #HomeBuying"},{"category":"Customer Trust","number":29,"text":"Professionalism is not about using complicated terms. It is about making things easy to understand.\n\nFrom consultation and viewing to financing and after-sales support, we aim to make the journey smoother.\n\nWe value long-term relationships, not just one transaction.\n\n#CSGPROPERTY #TrustedPropertyAdvisor #ProfessionalService #HomeBuying"},{"category":"Customer Trust","number":30,"text":"Every client has a different budget, family situation and long-term plan.\n\nFrom consultation and viewing to financing and after-sales support, we aim to make the journey smoother.\n\nWe respond to every trust with professionalism, responsibility and sincerity.\n\n#CSGPROPERTY #TrustedPropertyAdvisor #ProfessionalService #HomeBuying"},{"category":"Short Video Scripts","number":1,"text":"Hook: Buying a property is not just about whether it looks nice. It is about whether it fits your needs.\n\nMain Content: Many buyers focus only on design and surroundings, but long-term value also depends on location, growth potential, layout practicality, access, amenities and monthly commitment. Before choosing, get clear about your priorities first.\n\nCTA: If you want to know which type of project suits you, speak to CSG PROPERTY for a proper analysis.\n\n#CSGPROPERTY #RealEstateKnowledge #HomeBuyingTips #ShortVideoScripts"},{"category":"Short Video Scripts","number":2,"text":"Hook: Many buyers ask me, if my budget is not high, does that mean I cannot buy a good property?\n\nMain Content: Not necessarily. The key is not buying the most expensive property, but buying the right one. With a limited budget, you need to look at down payment, monthly instalment, location, rental or resale potential and lifestyle fit.\n\nCTA: If you are unsure what your budget can buy, message me and I can help you narrow down the direction.\n\n#CSGPROPERTY #BuyerQuestions #PropertyAdvice #ShortVideoScripts"},{"category":"Short Video Scripts","number":3,"text":"Hook: Introducing a project is not just about saying the price is attractive.\n\nMain Content: A good project introduction should explain who it is suitable for, what needs it solves, nearby amenities, access, layout practicality and whether it fits own-stay or investment goals.\n\nCTA: If you want projects that match your budget and needs, CSG PROPERTY can help you review the options.\n\n#CSGPROPERTY #NewProjects #ProjectIntroduction #ShortVideoScripts"},{"category":"Short Video Scripts","number":4,"text":"Hook: A property agent's day is not only about bringing clients to view units.\n\nMain Content: We follow up on client needs, prepare project information, create content, study the market, arrange viewings, handle loan questions and keep learning new projects and sales skills. Behind every deal, there are many details.\n\nCTA: If you want to understand a real estate career, talk to CSG PROPERTY.\n\n#CSGPROPERTY #AgentLife #RealEstateCareer #ShortVideoScripts"},{"category":"Short Video Scripts","number":5,"text":"Hook: When a client says, let me think about it, do not give up immediately.\n\nMain Content: That sentence may mean the budget is unclear, family approval is pending, the location is still being compared or trust in the project is not strong enough. Professional follow-up means identifying the real concern and giving clear information.\n\nCTA: If you have questions about buying property, tell us your concern and CSG PROPERTY will guide you step by step.\n\n#CSGPROPERTY #CustomerQuestions #PropertySales #ShortVideoScripts"},{"category":"Short Video Scripts","number":6,"text":"Hook: Why should every property agent build a personal brand?\n\nMain Content: Because clients are not only choosing a property. They are also choosing someone they can trust. Consistently sharing knowledge, real daily work, client questions and project analysis helps people understand your professionalism and attitude.\n\nCTA: If you want to learn content and sales with a team, join CSG PROPERTY.\n\n#CSGPROPERTY #PersonalBranding #PropertyAgent #ShortVideoScripts"},{"category":"Short Video Scripts","number":7,"text":"Hook: Can you become a property agent with no real estate experience?\n\nMain Content: Yes, if you are willing to learn and take action. CSG PROPERTY provides project information, training, team guidance and content direction so new agents do not have to figure everything out alone.\n\nCTA: If you want to start a career with growth potential, message us to learn more.\n\n#CSGPROPERTY #Recruitment #NewAgents #ShortVideoScripts"},{"category":"Short Video Scripts","number":8,"text":"Hook: Closing a sale is not about pressuring the client. It is about solving the problem.\n\nMain Content: When a client hesitates, an agent should confirm needs, prepare comparisons, explain financing, respond to concerns and match the client with the right project. Professional follow-up works better than constant pushing.\n\nCTA: Follow CSG PROPERTY if you want to learn a more structured property sales method.\n\n#CSGPROPERTY #ClosingSkills #ClientFollowUp #ShortVideoScripts"},{"category":"Short Video Scripts","number":9,"text":"Hook: Before buying a property, ask yourself three questions.\n\nMain Content: First, is it for own stay or investment? Second, what monthly instalment can you comfortably handle? Third, will this location still suit you in the next three to five years? Clear answers lead to better choices.\n\nCTA: If you need help organizing your buying direction, CSG PROPERTY can help you analyze it.\n\n#CSGPROPERTY #HomeBuyingKnowledge #PropertyPlanning #ShortVideoScripts"},{"category":"Short Video Scripts","number":10,"text":"Hook: Why can two properties with the same price feel completely different?\n\nMain Content: Because price is only one factor. Floor level, size, direction, facilities, maintenance fee, access and future supply all affect living experience and long-term value. Always compare the full picture.\n\nCTA: If you want to know which project suits you better, ask CSG PROPERTY for a comparison.\n\n#CSGPROPERTY #BuyerFAQ #ProjectComparison #ShortVideoScripts"},{"category":"Short Video Scripts","number":11,"text":"Hook: Whether a project suits you is not decided by how attractive the advertisement looks.\n\nMain Content: We look at location, price, layout, facilities, access, surrounding demand and the buyer's goal. If verified information is not enough, we check further instead of giving empty promises.\n\nCTA: For real project analysis, contact CSG PROPERTY.\n\n#CSGPROPERTY #ProjectAnalysis #NewProjectPromotion #ShortVideoScripts"},{"category":"Short Video Scripts","number":12,"text":"Hook: When you see an agent posting a video, a lot of preparation has already happened behind the scenes.\n\nMain Content: Before one short video, we understand the project, organize selling points, think through client questions, write the script, film, edit and publish. Content is not random. It helps clients understand projects faster.\n\nCTA: If you want to learn property content creation, join the CSG PROPERTY team.\n\n#CSGPROPERTY #AgentLife #PropertyContent #ShortVideoScripts"},{"category":"Short Video Scripts","number":13,"text":"Hook: A common client question is: am I too late to buy now?\n\nMain Content: The key is not early or late. The key is whether you are buying correctly. The market changes every day, but good location, suitable budget, clear needs and proper planning matter more than waiting blindly.\n\nCTA: If you want to know whether now is the right time for you, CSG PROPERTY can help you analyze it.\n\n#CSGPROPERTY #CustomerFAQ #BuyingTiming #ShortVideoScripts"},{"category":"Short Video Scripts","number":14,"text":"Hook: Your social media is the first office where clients meet you.\n\nMain Content: When you consistently share professional content, viewing routines, client cases and market observations, clients find it easier to trust you. Personal branding is not showing off. It is showing your professionalism.\n\nCTA: If you want to build your property personal brand, grow with CSG PROPERTY.\n\n#CSGPROPERTY #PersonalBrand #RealEstateMarketing #ShortVideoScripts"},{"category":"Short Video Scripts","number":15,"text":"Hook: Thinking of changing career direction but not sure where to start?\n\nMain Content: Real estate suits people who are willing to learn, communicate and build themselves. CSG PROPERTY provides training, projects, team support and practical opportunities to help you grow step by step.\n\nCTA: If you want to explore property agent opportunities, message us.\n\n#CSGPROPERTY #PropertyRecruitment #CareerOpportunity #ShortVideoScripts"},{"category":"Short Video Scripts","number":16,"text":"Hook: Client follow-up is not asking, have you decided, every day.\n\nMain Content: A better way is to give useful information such as budget planning, project comparisons, financing reminders, viewing points and answers to what the client really cares about. Make the client feel helped, not pressured.\n\nCTA: Follow CSG PROPERTY to improve your follow-up and closing skills.\n\n#CSGPROPERTY #FollowUpSkills #PropertyClosing #ShortVideoScripts"},{"category":"Short Video Scripts","number":17,"text":"Hook: Looking at facilities is not only about whether the project has a swimming pool.\n\nMain Content: You should also check whether the facilities are practical, whether management is reasonable, whether your family will actually use them and whether the maintenance fee fits your budget. Beautiful facilities matter, but long-term usage matters more.\n\nCTA: If you want to know whether a project's facilities suit you, CSG PROPERTY can help you review them.\n\n#CSGPROPERTY #RealEstateKnowledge #Facilities #ShortVideoScripts"},{"category":"Short Video Scripts","number":18,"text":"Hook: First-time buyers often overlook cash flow more than property price.\n\nMain Content: Besides down payment and monthly instalment, you should prepare for legal fees, stamp duty, renovation, furniture, maintenance fee and moving costs. Calculate the full picture before buying to reduce pressure later.\n\nCTA: Need a home-buying budget checklist? Contact CSG PROPERTY.\n\n#CSGPROPERTY #FirstTimeBuyer #BuyingBudget #ShortVideoScripts"},{"category":"Short Video Scripts","number":19,"text":"Hook: When viewing a new project, always ask what lifestyle it is suitable for.\n\nMain Content: Some projects suit young working adults, some suit families and some suit rental investment. When we introduce projects, we look beyond selling points and check whether the project truly fits your needs.\n\nCTA: To find a better-matching project, contact CSG PROPERTY.\n\n#CSGPROPERTY #NewProjects #LifestyleProperty #ShortVideoScripts"},{"category":"Short Video Scripts","number":20,"text":"Hook: Real estate is not a solo battlefield. Team support matters.\n\nMain Content: New agents are most afraid of having no direction, no materials and no mentor. CSG PROPERTY focuses on training, guidance, content support and practical sharing so you can build your career with a system.\n\nCTA: If you want to join a team that develops new agents, talk to us.\n\n#CSGPROPERTY #RecruitAgents #TeamCulture #ShortVideoScripts"}];
const list=document.getElementById('list');
const search=document.getElementById('search');
const count=document.getElementById('count');
const empty=document.getElementById('empty');
let current='All';

function esc(s){
  return s.replace(/[&<>"']/g,function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m];
  });
}

function render(){
  const q=search.value.trim().toLowerCase();
  const items=DATA.filter(function(x){
    return (current==='All'||x.category===current) &&
      (!q||x.text.toLowerCase().includes(q)||x.category.toLowerCase().includes(q));
  });

  count.textContent='Showing '+items.length+' captions';
  empty.style.display=items.length?'none':'block';

  list.innerHTML=items.map(function(x,i){
    return '<article class="card">'+
      '<div class="badge">'+esc(x.category)+' '+String(x.number).padStart(2,'0')+'</div>'+
      '<div class="caption" id="cap-'+i+'">'+esc(x.text)+'</div>'+
      '<div class="actions">'+
      '<button class="copy" onclick="copyCaption(\'cap-'+i+'\',this)">Copy Caption</button>'+
      '<a class="social xhs" href="https://www.xiaohongshu.com" target="_blank">Xiaohongshu</a>'+
      '<a class="social fb" href="https://www.facebook.com" target="_blank">Facebook</a>'+
      '<a class="social tt" href="https://www.tiktok.com" target="_blank">TikTok</a>'+
      '</div><div class="tip">If copying does not work, press and hold the caption text.</div></article>';
  }).join('');
}

async function copyCaption(id,btn){
  const text=document.getElementById(id).innerText.trim();
  let ok=false;

  if(navigator.clipboard&&window.isSecureContext){
    try{
      await navigator.clipboard.writeText(text);
      ok=true;
    }catch(e){}
  }

  if(!ok){
    const t=document.createElement('textarea');
    t.value=text;
    t.style.position='fixed';
    t.style.left='-9999px';
    document.body.appendChild(t);
    t.select();
    try{ok=document.execCommand('copy')}catch(e){}
    document.body.removeChild(t);
  }

  if(ok){
    const old=btn.textContent;
    btn.textContent='Copied';
    const toast=document.getElementById('toast');
    toast.style.display='block';
    setTimeout(function(){
      toast.style.display='none';
      btn.textContent=old;
    },1600);
  }else{
    alert('Press and hold the caption text, then select Copy.');
  }
}

document.querySelectorAll('.filter').forEach(function(b){
  b.onclick=function(){
    document.querySelectorAll('.filter').forEach(function(x){x.classList.remove('active')});
    b.classList.add('active');
    current=b.dataset.cat;
    render();
  };
});

search.addEventListener('input',render);
render();
</script>
</body>
