const list=document.getElementById('list'),search=document.getElementById('search'),count=document.getElementById('count'),empty=document.getElementById('empty');
let current='全部';
function esc(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function render(){
 const q=search.value.trim().toLowerCase();
 const items=DATA.filter(x=>(current==='全部'||x.category===current)&&(!q||x.text.toLowerCase().includes(q)||x.category.toLowerCase().includes(q)));
 count.textContent=`显示 ${items.length} 条文案`;empty.style.display=items.length?'none':'block';
 list.innerHTML=items.map((x,i)=>`<article class="card"><div class="badge">${esc(x.category)} ${String(x.number).padStart(2,'0')}</div><div class="caption" id="cap-${i}">${esc(x.text)}</div><div class="actions"><button class="copy" onclick="copyCaption('cap-${i}',this)">复制文案</button><a class="social xhs" href="https://www.xiaohongshu.com" target="_blank">小红书</a><a class="social fb" href="https://www.facebook.com" target="_blank">Facebook</a><a class="social tt" href="https://www.tiktok.com" target="_blank">TikTok</a></div><div class="tip">复制不到时，请长按上面的文字复制。</div></article>`).join('');
}
async function copyCaption(id,btn){
 const text=document.getElementById(id).innerText.trim();let ok=false;
 if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);ok=true}catch(e){}}
 if(!ok){const t=document.createElement('textarea');t.value=text;t.style.position='fixed';t.style.left='-9999px';document.body.appendChild(t);t.select();try{ok=document.execCommand('copy')}catch(e){}document.body.removeChild(t)}
 if(ok){const old=btn.textContent;btn.textContent='已复制';const toast=document.getElementById('toast');toast.style.display='block';setTimeout(()=>{toast.style.display='none';btn.textContent=old},1600)} else alert('请长按文案文字，再选择复制。');
}
document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{document.querySelectorAll('.filter').forEach(x=>x.classList.remove('active'));b.classList.add('active');current=b.dataset.cat;render()});
